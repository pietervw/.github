name: OpenCode review (reusable)

# Call from a repo with a thin caller, see the root README. All guards live here
# so every repo gets the same behaviour from one place.
on:
  workflow_call:
    inputs:
      model:
        description: >-
          Deprecated single-model pin; when set it replaces the whole chain and
          disables fallback. Prefer models.
        type: string
        default: ""
      models:
        description: >-
          Comma-separated model chain, primary first; later entries are used when an
          earlier one fails with a usage limit (429/quota/billing).
        type: string
        default: zai-coding-plan/glm-5.3,opencode/glm-5.3-flash-free,opencode/deepseek-v4.1-flash-free
      cli-version:
        description: >-
          "host" (default) runs whatever CLI the runner host has installed; an
          exact version must match or the step fails. Forwarded to the action,
          which verifies but never installs the CLI.
        type: string
        default: host
      max-rounds:
        description: Completed review rounds allowed per PR before auto-review stops (0 = unlimited)
        type: string
        default: "3"
    secrets:
      ZHIPU_API_KEY:
        required: true

jobs:
  review:
    # Skip drafts, fork PRs (no secrets, untrusted code) and Dependabot (its
    # runs cannot read Actions secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # Includes the runner's CI slot wait (jobs queue behind one host-wide slot) and the capacity wait.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # A persistent self-hosted runner can cache a partial clone (promisor
      # remote, e.g. left by another job's sparse checkout): base-side blobs
      # are then missing and the review action's `git diff base...HEAD`
      # lazy-fetches them with no credentials — checkout removed its helper
      # (persist-credentials: false) — so git exits 128 and the review dies
      # (pietervw/.github#10). Repair the cached repo: drop the promisor
      # config and refetch every object unfiltered, so no lazy fetch is ever
      # needed again. The token authenticates this one fetch (private repo)
      # and is removed again on exit; the review step still never sees one.
      - name: Ensure blob-complete checkout (partial-clone runner cache, #10)
        shell: bash
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git config --get remote.origin.promisor >/dev/null 2>&1 \
             && ! git config --get remote.origin.partialclonefilter >/dev/null 2>&1; then
            echo "cached checkout is not a partial clone; nothing to repair"
            exit 0
          fi
          # git fetch --refetch needs git >= 2.36; fail loudly instead of
          # silently keeping the broken partial clone.
          gitver="$(git --version | awk '{print $3}')"
          if [ "$(printf '%s\n2.36\n' "$gitver" | sort -V | head -1)" != "2.36" ]; then
            echo "::error::partial clone detected but git ${gitver} < 2.36 lacks 'fetch --refetch'; upgrade git on this runner"
            exit 1
          fi
          echo "::notice::cached checkout is a partial clone; refetching all objects unfiltered (pietervw/.github#10)"
          git config --unset-all remote.origin.promisor || true
          git config --unset-all remote.origin.partialclonefilter || true
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${FETCH_TOKEN}" | base64 | tr -d '\n')"
          trap 'git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true' EXIT
          git fetch --quiet --refetch --no-tags origin
      - uses: pietervw/.github/.github/actions/opencode-review@v1
        with:
          api-key: ${{ secrets.ZHIPU_API_KEY }}
          model: ${{ inputs.model }}
          models: ${{ inputs.models }}
          cli-version: ${{ inputs.cli-version }}
          max-rounds: ${{ inputs.max-rounds }}
