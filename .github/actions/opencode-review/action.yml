name: OpenCode PR review
description: >-
  Read-only OpenCode review of the checked-out pull request. Waits for host capacity,
  then posts one updatable summary comment plus inline comments. Never approves,
  merges, or pushes. Caller must check out the PR head with fetch-depth 0 first.

inputs:
  api-key:
    description: z.ai coding plan key (ZHIPU_API_KEY). Pass a repository secret; never commit it.
    required: true
  model:
    description: >-
      Deprecated single-model pin. When set it overrides models and disables
      fallback. Leave unset to use the models chain.
    required: false
    default: ""
  models:
    description: >-
      Comma-separated model chain in provider/id form. The first entry is the primary
      (paid z.ai plan); later entries are keyless OpenCode free-tier fallbacks used
      when the primary hits a usage limit.
    required: false
    default: zai-coding-plan/glm-5.3,opencode/glm-5.3-flash-free,opencode/deepseek-v4.1-flash-free
  cli-version:
    description: >-
      "host" (default) runs whatever CLI the runner host has installed. An exact
      version (e.g. "1.19.5") must match or the step fails. The action never
      downloads or updates the CLI itself.
    required: false
    default: host
  prompt-file:
    description: Review prompt. Defaults to the prompt shipped with this action.
    required: false
    default: ""
  max-concurrent:
    description: Reviews allowed at once on one host
    required: false
    default: "1"
  max-rounds:
    description: >-
      Completed review rounds allowed per PR before auto-review stops and says so
      in the summary comment. 0 = unlimited.
    required: false
    default: "3"
  wait-seconds:
    description: How long to wait for host capacity before skipping with a notice
    required: false
    default: "600"
  github-token:
    description: Token used only to post the review (pull-requests write)
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Ensure OpenCode CLI
      shell: bash
      env:
        CLI_PIN: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        bin_dir="${HOME}/.opencode/bin"
        export PATH="${bin_dir}:${PATH}"
        current="$(opencode --version 2>/dev/null || true)"
        current="${current#v}"
        if [ -z "${current}" ]; then
          echo "::error::OpenCode CLI not found in PATH or ${bin_dir}. It is host-managed: install it on the runner host as the runner user (hosted ubuntu-latest runners do not have it — set the repo's RUNNER variable to a self-hosted runner that does). This action never downloads binaries."
          exit 1
        fi
        pin="${CLI_PIN:-host}"
        if [ "${pin}" != "host" ] && [ "${pin#v}" != "${current}" ]; then
          echo "::error::OpenCode CLI pinned to ${pin#v} but the host has ${current}. Update it on the runner host."
          exit 1
        fi
        echo "OpenCode CLI ${current} (host-managed)"
        echo "${bin_dir}" >> "${GITHUB_PATH}"

    # Read-only pre-check: has this PR already used its auto-review rounds?
    # Fails open (runs the review) when the comments API is unreachable, so a
    # GitHub hiccup can never silence reviews; the failure is still visible.
    - name: Review round cap
      id: roundcap
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REVIEW_MAX_ROUNDS: ${{ inputs.max-rounds }}
      run: |
        set -uo pipefail
        max_rounds="${REVIEW_MAX_ROUNDS:-3}"
        [[ "${max_rounds}" =~ ^[0-9]+$ ]] || max_rounds="3"
        out=""
        if ! out="$(python3 "${GITHUB_ACTION_PATH}/scripts/post_review.py" \
          --repo "${GITHUB_REPOSITORY}" --pr "${{ github.event.pull_request.number }}" \
          --check-round-cap "${max_rounds}" 2>&1)"; then
          echo "::warning::round-cap check failed, running the review anyway: ${out}"
          out="capped=false"
        fi
        echo "${out}" >&2
        if echo "${out}" | grep -q '^capped=true$'; then
          echo "capped=true" >> "${GITHUB_OUTPUT}"
        else
          echo "capped=false" >> "${GITHUB_OUTPUT}"
        fi

    # No GITHUB_TOKEN in this step's environment: the model can read the repo but
    # has no credentials to act on it. Results are posted by the next step.
    - name: Run review
      id: run
      if: ${{ steps.roundcap.outputs.capped != 'true' }}
      shell: bash
      env:
        ZHIPU_API_KEY: ${{ inputs.api-key }}
        REVIEW_MODELS: ${{ inputs.model != '' && inputs.model || inputs.models }}
        REVIEW_PROMPT_FILE: ${{ inputs.prompt-file || format('{0}/review-prompt.md', github.action_path) }}
        REVIEW_OUT_DIR: ${{ runner.temp }}/opencode-review
        REVIEW_MAX_CONCURRENT: ${{ inputs.max-concurrent }}
        REVIEW_WAIT_SEC: ${{ inputs.wait-seconds }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/run-review.sh"

    - name: Post review
      if: ${{ always() && (steps.run.conclusion != 'skipped' || steps.roundcap.outputs.capped == 'true') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_OUTCOME: ${{ steps.run.outcome }}
        RUN_STATUS: ${{ steps.run.outputs.status }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_MODEL: ${{ steps.run.outputs.model }}
        REVIEW_MAX_ROUNDS: ${{ inputs.max-rounds }}
      run: |
        set -euo pipefail
        out_dir="${RUNNER_TEMP}/opencode-review"
        max_rounds="${REVIEW_MAX_ROUNDS:-3}"
        [[ "${max_rounds}" =~ ^[0-9]+$ ]] || max_rounds="3"
        # Which tier actually reviewed: only when the run step recorded one
        # (a model really attempted the review). Capped/busy posts name no
        # model — none reviewed.
        review_model="${RUN_MODEL:-}"
        model_args=()
        if [ -n "${review_model}" ]; then
          model_args=(--model "${review_model}")
        fi
        review_note=""
        if [ -f "${out_dir}/status.json" ]; then
          review_note="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("note",""))' "${out_dir}/status.json" 2>/dev/null)" || review_note=""
        fi
        note_args=()
        if [ -n "${review_note}" ]; then
          note_args=(--note "${review_note}")
        fi
        if [ "${{ steps.roundcap.outputs.capped }}" = "true" ]; then
          python3 "${GITHUB_ACTION_PATH}/scripts/post_review.py" \
            --repo "${GITHUB_REPOSITORY}" --pr "${PR_NUMBER}" \
            --sha "${PR_HEAD_SHA}" "${model_args[@]}" \
            --status capped --max-rounds "${max_rounds}" \
            --out-dir "${out_dir}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          exit 0
        fi
        status="${RUN_STATUS:-failed}"
        reason=""
        if [ -f "${out_dir}/status.json" ]; then
          reason="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("reason",""))' "${out_dir}/status.json" 2>/dev/null)" || reason=""
        fi
        # Superseded or timed-out runs say nothing; the Actions UI shows the cancel.
        if [ "${RUN_OUTCOME}" = "cancelled" ]; then
          echo "Review run was cancelled; not posting."
          exit 0
        fi
        [ "${RUN_OUTCOME}" = "success" ] || { status="failed"; reason="${reason:-the review step failed before producing a result}"; }
        python3 "${GITHUB_ACTION_PATH}/scripts/post_review.py" \
          --repo "${GITHUB_REPOSITORY}" --pr "${PR_NUMBER}" \
          --sha "${PR_HEAD_SHA}" "${model_args[@]}" \
          --status "${status}" --reason "${reason}" --out-dir "${out_dir}" \
          --max-rounds "${max_rounds}" "${note_args[@]}" \
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
